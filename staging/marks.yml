apiVersion: v1
kind: Namespace
metadata:
  name: staging-marks

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marks
  namespace: staging-marks
  labels:
    app: marks
spec:
  selector:
    matchLabels:
      app: marks
  replicas: 1
  template:
    metadata:
     labels:
        app: marks
    spec:
     containers:
      - name: marks
        image: ahagbes/marks@sha256:2c01367a6bda8154f833e91cf1de78fa4cbbbb45d9d14b33abf277a2649d0acb
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 8080
          name: http
     restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: marks
  namespace: staging-marks
spec:
  selector:
    app: marks
  ports:
    - port: 80
      targetPort: http

