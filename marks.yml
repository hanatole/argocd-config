apiVersion: v1
kind: Namespace
metadata:
  name: marks

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marks
  namespace: marks
  labels:
    app: marks
spec:
  selector:
    matchLabels:
      app: marks
  replicas: 1
  template:
    metadata:
     labels:
        app: marks
    spec:
     containers:
      - name: marks
        image: ahagbes/mark:1.0.0
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 8080
          name: http
     restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: marks
  namespace: marks
spec:
  selector:
    app: marks
  ports:
    - port: 80
      targetPort: http

